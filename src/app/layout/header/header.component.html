<header class="site-header" id="top">
    <div class="container site-header__inner">
        <a class="brand" href="#top" aria-label="Página inicial">
            <span class="brand__mark">
                <img src="/logo-transparente.png" alt="" aria-hidden="true" />
            </span>
            <span class="brand__text">João Pedro</span>
        </a>

        <nav class="site-nav" aria-label="Navegação principal" [class.is-open]="menuOpen()">
            @for (item of navigation; track item.href) {
            <a [href]="item.href" class="site-nav__link" (click)="closeMenu()">
                {{ item.label }}
            </a>
            }
        </nav>

        <div class="site-header__actions">
            <app-button href="#contato" variant="secondary">Vamos conversar</app-button>
            <button class="menu-toggle" type="button" [attr.aria-label]="menuOpen() ? closeMenuLabel : openMenuLabel"
                [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
                @if (!menuOpen()) {
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
                } @else {
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
                }
            </button>
        </div>
    </div>
</header>
