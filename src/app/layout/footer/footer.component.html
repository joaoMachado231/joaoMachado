<footer class="site-footer">
    <div class="container site-footer__inner">
        <div class="site-footer__brand" aria-label="Brand do João Pedro">
            <span class="site-footer__brand-mark">
                <img src="/logo-transparente.png" alt="" aria-hidden="true" />
            </span>
            <div class="site-footer__brand-copy">
                <span class="site-footer__name">João Pedro</span>
                <span class="site-footer__role">Desenvolvedor de Software</span>
            </div>
        </div>

        <nav class="site-footer__nav" aria-label="Links do rodapé">
            @for (item of navigation; track item.href) {
            <a [href]="item.href">{{ item.label }}</a>
            }
        </nav>

        <div class="site-footer__socials" aria-label="Redes sociais">
            @for (link of socialLinks; track link.href) {
            <a [href]="link.href" [attr.target]="link.external ? '_blank' : null"
                [attr.rel]="link.external ? 'noopener noreferrer' : null" [attr.aria-label]="link.label"
                [title]="link.label">
                @switch (link.icon) {
                    @case ('github') {
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 19c-4.3 1.4-4.3-2.5-6-3" />
                        <path
                            d="M15 22v-4.7a3.4 3.4 0 0 0-1-2.6c3.2-.4 6.6-1.5 6.6-7A5.5 5.5 0 0 0 20 4.5 5.1 5.1 0 0 0 19.7 1s-1.6.3-4.4 1.8a15.2 15.2 0 0 0-8 0C6.9 1.3 5.3 1 5.3 1A5.1 5.1 0 0 0 5 4.5 5.5 5.5 0 0 0 3.5 9c0 5.5 3.3 6.6 6.5 7A3.4 3.4 0 0 0 9 18.3V22" />
                    </svg>
                    }
                    @case ('linkedin') {
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-6.5a1.5 1.5 0 0 0-3 0V21h-4v-7a6 6 0 0 1 6-6Z" />
                        <path d="M2 9h4v12H2z" />
                        <circle cx="4" cy="4" r="2" />
                    </svg>
                    }
                }
            </a>
            }
        </div>
    </div>

    <div class="site-footer__meta">
        <div class="container site-footer__meta-inner">
            <span>© {{ year }} João Pedro. Todos os direitos reservados.</span>
            <span>Feito com <span class="site-footer__heart" aria-hidden="true">♥</span> por João Pedro.</span>
        </div>
    </div>
</footer>
